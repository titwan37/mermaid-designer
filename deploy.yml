---
- name: Deploy Mermaid Designer to IONOS (Co-existence Mode)
  hosts: webserver
  vars:
    app_dir: "/var/www/mermaid-designer"
    node_version: "20.x"
    app_port: 3033

  tasks:
    - name: Update apt cache
      become: yes
      apt: update_cache=yes

    - name: Install Node.js and PM2
      become: yes
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_{{ node_version }} | bash -
        apt-get install -y nodejs rsync
        npm install pm2 -g

    - name: Create dedicated app directory
      become: yes
      file: path={{ app_dir }} state=directory owner=root group=root mode='0755'

    - name: Sync project files
      synchronize:
        src: ./
        dest: "{{ app_dir }}/"
        recursive: yes
        delete: yes
        rsync_opts:
          - "--exclude=.next"
          - "--exclude=node_modules"
          - "--exclude=ansible"
          - "--exclude=.git"
      delegate_to: localhost
      become: no

    - name: Build Application
      become: yes
      shell: |
        npm install --legacy-peer-deps
        npm run build
      args:
        chdir: "{{ app_dir }}"

    - name: Start App on Port 3033 via PM2
      become: yes
      shell: |
        pm2 delete mermaid-designer || true
        PORT={{ app_port }} pm2 start npm --name "mermaid-designer" -- start
      args:
        chdir: "{{ app_dir }}"
